name: Validate Kupon
on:
  push:
    branches: [fix/otomatik-skorlar-veri-senkron, main]
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: nl -ba lib/league-fixtures.ts | sed -n '200,220p'
      - run: npx tsc --noEmit
      - run: npm run test:optimizer
      - run: npm run test:v4
